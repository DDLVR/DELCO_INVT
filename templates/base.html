{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sistema Operativo{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static 'img/delco.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'img/delco.png' %}">

  <!-- Bootstrap (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="{% static 'css/app.css' %}">

  <style>
    :root {
      --delco-primary: #1a3a5c;
      --delco-secondary: #2c5282;
      --delco-accent: #4a90e2;
      --delco-dark: #0f2438;
      --delco-light: #e8f1f8;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    nav {
      flex-shrink: 0;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      flex-shrink: 0;
      overflow-y: auto;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      main {
        width: 100%;
      }
    }
  </style>
</head>

<body class="bg-light">

  <!-- Navbar -->
  {% include "partials/navbar.html" %}

  <div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar" style="width: 250px; display: flex; flex-direction: column;">
      {% include "partials/sidebar.html" %}
    </div>

    <!-- Contenido Principal -->
    <main class="flex-fill">
      <!-- Mensajes del sistema (éxito/error) -->
      {% if messages %}
        <div class="mb-3">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- jQuery (requerido por DataTables) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
