{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('delco-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>{% block title %}Sistema Operativo{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static 'img/delco.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'img/delco.png' %}">

  <!-- Bootstrap (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="{% static 'css/app.css' %}">

  <style>
    :root {
      --delco-primary: #1a3a5c;
      --delco-secondary: #2c5282;
      --delco-accent: #4a90e2;
      --delco-dark: #0f2438;
      --delco-light: #e8f1f8;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    nav {
      flex-shrink: 0;
    }

    .main-container {
      display: flex;
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    .sidebar {
      flex-shrink: 0;
      overflow-y: auto;
      width: 220px;
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, border-color 0.2s ease;
    }

    main {
      flex: 1;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 16px;
    }

    @media (max-width: 991.98px) {
      main {
        padding: 12px;
      }

      .sidebar {
        width: 220px;
      }
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: calc(100dvh - 56px);
    }

    /* Encabezados de tablas — mismo estilo que el navbar */
    .table-delco thead th {
      background: linear-gradient(135deg, var(--delco-primary) 0%, var(--delco-secondary) 100%) !important;
      color: #fff !important;
      border-color: var(--delco-primary) !important;
      font-weight: 600;
    }

    .card-header-delco {
      background: linear-gradient(135deg, var(--delco-primary) 0%, var(--delco-secondary) 100%);
      color: #fff;
    }
  </style>
</head>

<body class="bg-body-tertiary delco-app overflow-x-hidden">
<script>try{if(localStorage.getItem('delco-sidebar-collapsed')==='1'){document.body.classList.add('delco-sidebar-collapsed');}}catch(e){}</script>

  <!-- Navbar -->
  {% include "partials/navbar.html" %}

  <div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar">
      {% include "partials/sidebar.html" %}
    </div>

    <!-- Contenido Principal -->
    <main class="flex-fill">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- jQuery (requerido por DataTables) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>


  <!-- ════════════════════════════════════════════
       SISTEMA GLOBAL DE TOASTS
       Uso: showToast('Texto', 'success'|'danger'|'warning'|'info', ms)
       Duración 0 = sin auto-cierre (para errores)
  ════════════════════════════════════════════ -->
  <div id="delco-toast-container"
       class="toast-container position-fixed top-0 end-0 p-3"
      style="z-index:1100;"></div>

  <!-- Confirmación global (reemplaza confirm() del navegador) -->
  <div class="modal fade" id="delcoConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-warning-subtle">
          <h5 class="modal-title" id="delcoConfirmTitle">
            <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
            Confirmar acción
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="delcoConfirmMessage">
          ¿Deseas continuar?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="delcoConfirmCancelBtn">
            Cancelar
          </button>
          <button type="button" class="btn btn-danger" id="delcoConfirmOkBtn">
            Sí, continuar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
  window.showToast = function (message, type, duration) {
    if (!type) type = 'success';
    if (type === 'error') type = 'danger';
    if (duration === undefined) {
      duration = (type === 'danger') ? 0 : (type === 'warning' ? 7000 : 4000);
    }
    var icons = {
      success:   'bi-check-circle-fill',
      danger:    'bi-x-circle-fill',
      warning:   'bi-exclamation-triangle-fill',
      info:      'bi-info-circle-fill',
      secondary: 'bi-bell-fill'
    };
    var light   = (type === 'warning' || type === 'info');
    var icon    = icons[type] || 'bi-bell-fill';
    var textCls = light ? 'text-dark' : 'text-white';
    var closeCls= light ? 'btn-close' : 'btn-close btn-close-white';

    var container = document.getElementById('delco-toast-container');
    if (!container) return;

    var el = document.createElement('div');
    el.className = 'toast align-items-center bg-' + type + ' ' + textCls + ' border-0 shadow-sm mb-2';
    el.setAttribute('role', 'alert');
    el.setAttribute('aria-live', 'assertive');
    el.setAttribute('aria-atomic', 'true');
    el.style.minWidth = '280px';
    el.innerHTML =
      '<div class="d-flex">'
      + '<div class="toast-body fw-semibold"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>'
      + '<button type="button" class="' + closeCls + ' me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>'
      + '</div>';

    container.appendChild(el);
    var opts = duration > 0 ? { delay: duration, autohide: true } : { autohide: false };
    bootstrap.Toast.getOrCreateInstance(el, opts).show();
    el.addEventListener('hidden.bs.toast', function () { el.remove(); });
  };

  // Confirmación global visual para reemplazar window.confirm
  window.showConfirm = function (message, title, confirmText, cancelText) {
    return new Promise(function (resolve) {
      var modalEl = document.getElementById('delcoConfirmModal');
      if (!modalEl || typeof bootstrap === 'undefined') {
        if (window.showToast) {
          window.showToast('No fue posible mostrar la confirmación visual.', 'warning');
        }
        resolve(false);
        return;
      }

      var titleEl = document.getElementById('delcoConfirmTitle');
      var messageEl = document.getElementById('delcoConfirmMessage');
      var okBtn = document.getElementById('delcoConfirmOkBtn');
      var cancelBtn = document.getElementById('delcoConfirmCancelBtn');

      messageEl.textContent = message || '¿Deseas continuar?';
      if (title) {
        titleEl.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>' + title;
      } else {
        titleEl.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Confirmar acción';
      }
      okBtn.textContent = confirmText || 'Sí, continuar';
      cancelBtn.textContent = cancelText || 'Cancelar';

      var modal = bootstrap.Modal.getOrCreateInstance(modalEl, {
        backdrop: 'static',
        keyboard: true
      });

      var done = false;
      var cleanup = function () {
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        modalEl.removeEventListener('hidden.bs.modal', onHidden);
      };
      var finish = function (result) {
        if (done) return;
        done = true;
        cleanup();
        resolve(result);
      };

      var onOk = function () {
        modal.hide();
        finish(true);
      };
      var onCancel = function () {
        modal.hide();
        finish(false);
      };
      var onHidden = function () {
        finish(false);
      };

      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      modalEl.addEventListener('hidden.bs.modal', onHidden);
      modal.show();
    });
  };

  /**
   * Importación Excel con barra de progreso (subida + procesamiento en servidor).
   * config: { url, form, submitBtn, validate, onSuccess, onError }
   */
  window.ejecutarImportacionExcel = function (config) {
    var form = config.form;
    var submitBtn = config.submitBtn;
    var url = config.url;
    var modalEl = config.modalEl || (form ? form.closest('.modal') : null);
    if (!form || !url) return Promise.reject(new Error('Formulario o URL no definidos'));

    var scope = form.closest('.modal-content') || form;
    var wrap = scope.querySelector('.delco-import-progress');
    var bar = scope.querySelector('.delco-import-progress-bar');
    var label = scope.querySelector('.delco-import-progress-label');
    var pctEl = scope.querySelector('.delco-import-progress-pct');
    var dismissButtons = modalEl
      ? modalEl.querySelectorAll('[data-bs-dismiss="modal"]')
      : [];

    function setProgress(value, text) {
      var pct = Math.max(0, Math.min(100, Math.round(value)));
      if (bar) {
        bar.style.width = pct + '%';
        bar.textContent = pct + '%';
        bar.setAttribute('aria-valuenow', pct);
      }
      if (pctEl) pctEl.textContent = pct + '%';
      if (label && text) label.textContent = text;
    }

    function lockModal() {
      if (modalEl) modalEl.dataset.importing = '1';
      dismissButtons.forEach(function (btn) { btn.disabled = true; });
    }

    function unlockModal() {
      if (modalEl) modalEl.dataset.importing = '0';
      dismissButtons.forEach(function (btn) { btn.disabled = false; });
    }

    if (typeof config.validate === 'function' && config.validate() === false) {
      return Promise.resolve(false);
    }

    var fileInput = config.fileInput || form.querySelector('input[type="file"]');
    if (!fileInput || !fileInput.files || !fileInput.files.length) {
      return Promise.reject(new Error('No se seleccionó ningún archivo.'));
    }

    var formData = new FormData(form);
    formData.set('archivo', fileInput.files[0]);

    var csrfInput = form.querySelector('[name=csrfmiddlewaretoken]');
    var csrfToken = csrfInput ? csrfInput.value : '';

    lockModal();
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.dataset.originalText = submitBtn.dataset.originalText || submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Importando...';
    }
    if (wrap) wrap.style.display = 'block';
    setProgress(3, 'Preparando archivo...');

    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      var timer = null;
      var serverPct = 45;

      xhr.open('POST', url, true);
      if (csrfToken) xhr.setRequestHeader('X-CSRFToken', csrfToken);
      xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

      xhr.upload.addEventListener('progress', function (ev) {
        if (ev.lengthComputable && ev.total > 0) {
          var uploadPct = 5 + Math.round((ev.loaded / ev.total) * 35);
          setProgress(uploadPct, 'Subiendo archivo... (' + Math.round((ev.loaded / ev.total) * 100) + '%)');
        } else {
          setProgress(20, 'Subiendo archivo...');
        }
      });

      xhr.upload.addEventListener('loadend', function () {
        setProgress(45, 'Archivo recibido. Procesando filas en el servidor...');
        timer = setInterval(function () {
          if (serverPct < 92) {
            serverPct += 1;
            setProgress(serverPct, 'Procesando filas en el servidor...');
          }
        }, 350);
      });

      xhr.onload = function () {
        if (timer) clearInterval(timer);
        setProgress(100, 'Importación finalizada');

        var data = null;
        try {
          data = JSON.parse(xhr.responseText);
        } catch (e) {
          var err = new Error('Respuesta inválida del servidor (código ' + xhr.status + ').');
          unlockModal();
          if (typeof config.onError === 'function') config.onError(err);
          reject(err);
          return;
        }

        if (xhr.status >= 200 && xhr.status < 300) {
          if (typeof config.onSuccess === 'function') config.onSuccess(data);
          resolve(data);
        } else {
          var errHttp = new Error((data && data.message) ? data.message : ('Error HTTP ' + xhr.status));
          unlockModal();
          if (typeof config.onError === 'function') config.onError(errHttp, data);
          reject(errHttp);
        }
      };

      xhr.onerror = function () {
        if (timer) clearInterval(timer);
        setProgress(0, 'Error de conexión');
        unlockModal();
        var errNet = new Error('No se pudo conectar con el servidor.');
        if (typeof config.onError === 'function') config.onError(errNet);
        reject(errNet);
      };

      xhr.onloadend = function () {
        unlockModal();
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = submitBtn.dataset.originalText || 'Importar';
        }
      };

      xhr.send(formData);
    });
  };

  // Auto-mostrar mensajes Django como toasts al cargar la página
  document.addEventListener('DOMContentLoaded', function () {
    var themeBtn = document.getElementById('delcoThemeToggle');
    var themeIcon = document.getElementById('delcoThemeIcon');
    function applyThemeIcon(theme) {
      if (!themeIcon) return;
      themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    }
    applyThemeIcon(document.documentElement.getAttribute('data-bs-theme') || 'light');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-bs-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', next);
        try { localStorage.setItem('delco-theme', next); } catch (e) { /* ignore */ }
        applyThemeIcon(next);
      });
    }

    var appBody = document.body;
    var sidebarToggle = document.getElementById('delcoSidebarToggle');
    var sidebarToggleIcon = document.getElementById('delcoSidebarToggleIcon');
    function applySidebarState(collapsed) {
      if (!appBody) return;
      appBody.classList.toggle('delco-sidebar-collapsed', collapsed);
      if (sidebarToggleIcon) {
        sidebarToggleIcon.className = collapsed ? 'bi bi-layout-sidebar' : 'bi bi-layout-sidebar-inset';
      }
    }
    try {
      var sidebarCollapsed = localStorage.getItem('delco-sidebar-collapsed') === '1';
      applySidebarState(sidebarCollapsed);
    } catch (e) { /* ignore */ }
    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', function () {
        var next = !appBody.classList.contains('delco-sidebar-collapsed');
        applySidebarState(next);
        try { localStorage.setItem('delco-sidebar-collapsed', next ? '1' : '0'); } catch (e) { /* ignore */ }
      });
    }

    var profileModalEl = document.getElementById('profileModal');

    function openProfileModalSafe() {
      if (!profileModalEl || typeof bootstrap === 'undefined') return;
      var modal = bootstrap.Modal.getOrCreateInstance(profileModalEl);
      modal.show();
    }

    document.querySelectorAll('.js-open-profile').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.preventDefault();
        openProfileModalSafe();
      });
    });

    {% for message in messages %}
    showToast(
      "{{ message|escapejs }}",
      "{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}"
    );
    {% endfor %}
  });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
