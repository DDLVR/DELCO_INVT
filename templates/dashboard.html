{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Dashboard</h4>
  <span class="badge text-bg-secondary">{{ user.rol }}</span>
</div>

<div class="row g-3">
  <div class="col-12 col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="text-muted">Órdenes (pronto)</div>
        <div class="fs-3 fw-semibold">0</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="text-muted">Inventario crítico (pronto)</div>
        <div class="fs-3 fw-semibold">0</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="text-muted">Movimientos hoy (pronto)</div>
        <div class="fs-3 fw-semibold">0</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
