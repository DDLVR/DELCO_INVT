{% extends 'base.html' %}

{% block title %}Nueva carga administrativa{% endblock %}

{% block content %}
<div class="container-fluid py-3" style="max-width: 720px;">
  <h1 class="h3 mb-3"><i class="bi bi-plus-circle"></i> Nueva carga</h1>
  <form method="post" class="card delco-panel-card">
    {% csrf_token %}
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Título *</label>
        <input type="text" name="titulo" class="form-control" required maxlength="200">
      </div>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label">Tipo</label>
          <select name="tipo" class="form-select">
            {% for codigo, nombre in tipos %}
            <option value="{{ codigo }}">{{ nombre }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Prioridad</label>
          <select name="prioridad" class="form-select">
            {% for codigo, nombre in prioridades %}
            <option value="{{ codigo }}" {% if codigo == 'MEDIA' %}selected{% endif %}>{{ nombre }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Asignar a</label>
        <select name="asignado_a" class="form-select">
          <option value="">Sin asignar</option>
          {% for u in administrativos %}
          <option value="{{ u.id }}" {% if u.id == user.id %}selected{% endif %}>{{ u.nombre_interno }} ({{ u.get_rol_display }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="4" placeholder="Qué hay que verificar o validar…"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">URL de referencia (opcional)</label>
        <input type="text" name="url_referencia" class="form-control" placeholder="/ordenes/123/">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Crear carga</button>
        <a href="{% url 'cargas_hub' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
