{% extends 'base.html' %}

{% block title %}Nueva carga administrativa{% endblock %}

{% block content %}
<div class="container-fluid py-4 delco-catalogo" style="max-width: 760px;">
  <div class="delco-catalogo-hero mb-3">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
      <div>
        <p class="delco-catalogo-kicker mb-1">Cargas</p>
        <h1 class="h3 mb-1">Nueva carga</h1>
      </div>
      <div class="delco-action-bar">
        <a href="{% url 'cargas_list' %}" class="delco-action-btn is-help">
          <span class="delco-action-btn-icon"><i class="bi bi-arrow-left"></i></span>
          Volver
        </a>
      </div>
    </div>
  </div>
  <form method="post" class="card delco-panel-card">
    {% csrf_token %}
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Título *</label>
        <input type="text" name="titulo" class="form-control" required maxlength="200">
      </div>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label">Tipo</label>
          <select name="tipo" class="form-select">
            {% for codigo, nombre in tipos %}
            <option value="{{ codigo }}">{{ nombre }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Prioridad</label>
          <select name="prioridad" class="form-select">
            {% for codigo, nombre in prioridades %}
            <option value="{{ codigo }}" {% if codigo == 'MEDIA' %}selected{% endif %}>{{ nombre }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Asignar a</label>
        <select name="asignado_a" class="form-select">
          <option value="">Sin asignar</option>
          {% for u in administrativos %}
          <option value="{{ u.id }}" {% if u.id == user.id %}selected{% endif %}>{{ u.nombre_interno }} ({{ u.get_rol_display }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="4" placeholder="Qué hay que verificar o validar…"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Proyecto / listado</label>
        <input type="text" name="proyecto" class="form-control" maxlength="255"
               list="listaProyectosCarga" placeholder="Nombre del proyecto…">
        <datalist id="listaProyectosCarga">
          {% for p in proyectos_disponibles %}
          <option value="{{ p }}">
          {% endfor %}
        </datalist>
        <div class="form-text">Si lo indicas, el enlace abrirá el listado de OT filtrado por ese proyecto.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">URL de referencia (opcional)</label>
        <input type="text" name="url_referencia" class="form-control" placeholder="Se completa sola si hay proyecto">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Crear carga</button>
        <a href="{% url 'cargas_hub' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
