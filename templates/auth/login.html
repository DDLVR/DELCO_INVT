{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesion - DelcoChile Telecomunicaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 16px;
      background: linear-gradient(to top, #89cbe9 0%, #c8e9f7 45%, #eaf7ff 100%);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
    }
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(16, 67, 96, 0.2);
    }
    .card-body {
      padding: 40px;
    }
    .form-control {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 15px;
    }
    .form-control:focus {
      border-color: #2c5282;
      box-shadow: 0 0 0 0.2rem rgba(44, 82, 130, 0.2);
    }
    .btn-primary {
      background-color: #1a3a5c;
      border: none;
      padding: 10px;
      font-weight: 600;
      border-radius: 8px;
      margin-top: 20px;
    }
    .btn-primary:hover {
      background-color: #2c5282;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo img {
      max-width: 160px;
      width: 100%;
      height: auto;
      margin-bottom: 8px;
    }
    .logo h1 {
      color: #1a3a5c;
      font-weight: 700;
      font-size: 26px;
      margin-bottom: 0;
    }
    .alert {
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 576px) {
      .card-body {
        padding: 26px 20px;
      }
      .logo img {
        max-width: 130px;
      }
      .logo h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="card-body">
        <div class="logo">
          <img src="{% static 'img/delco.png' %}" alt="DelcoChile Telecomunicaciones" onerror="this.onerror=null;this.src='/staticfiles/img/delco.png';">
          <h1>DelcoChile Telecomunicaciones</h1>
          <p class="text-muted">Sistema de Operaciones</p>
        </div>

        {# Mensajes Django → toasts (ver script al final del body) #}
        {% if messages %}
        <div id="login-pending-toasts" style="display:none">
          {% for message in messages %}
          <span data-msg="{{ message|escapejs }}"
                data-type="{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}"></span>
          {% endfor %}
        </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">RUT</label>
            <input type="text" name="username" class="form-control" id="login-rut" maxlength="12" pattern="\d{1,2}\.\d{3}\.\d{3}-[0-9Kk]" placeholder="Ej: 12.345.678-K" required autofocus autocomplete="off">
            <small class="text-muted">Ejemplo: 12.345.678-K</small>
          </div>
  <script>
  // Formateo automático de RUT en login
  document.addEventListener('DOMContentLoaded', function() {
    const rutInput = document.getElementById('login-rut');
    rutInput.addEventListener('input', function() {
      let val = this.value.replace(/[^0-9Kk]/g, '').toUpperCase();
      let formatted = '';
      if (val.length > 1) {
        // Dígito verificador
        let dv = val.slice(-1);
        let num = val.slice(0, -1);
        // Formateo progresivo
        if (num.length > 6) {
          formatted = num.slice(0, num.length - 6) + '.' + num.slice(num.length - 6, num.length - 3) + '.' + num.slice(num.length - 3) + '-' + dv;
        } else if (num.length > 3) {
          formatted = num.slice(0, num.length - 3) + '.' + num.slice(num.length - 3) + '-' + dv;
        } else {
          formatted = num + '-' + dv;
        }
      } else {
        formatted = val;
      }
      this.value = formatted;
    });
  });
  </script>

          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">Iniciar Sesión</button>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toast container + showToast (standalone, no extiende base.html) -->
  <div id="delco-toast-container"
       class="toast-container position-fixed top-0 end-0 p-3"
       style="z-index:1100; min-width:320px;"></div>

  <script>
  (function () {
    function showToast(message, type, duration) {
      if (!type) type = 'success';
      if (type === 'error') type = 'danger';
      if (duration === undefined) {
        duration = (type === 'danger') ? 0 : (type === 'warning' ? 7000 : 4000);
      }
      var icons = {
        success: 'bi-check-circle-fill', danger: 'bi-x-circle-fill',
        warning: 'bi-exclamation-triangle-fill', info: 'bi-info-circle-fill'
      };
      var light   = (type === 'warning' || type === 'info');
      var icon    = icons[type] || 'bi-bell-fill';
      var textCls = light ? 'text-dark' : 'text-white';
      var closeCls= light ? 'btn-close' : 'btn-close btn-close-white';
      var container = document.getElementById('delco-toast-container');
      if (!container) return;
      var el = document.createElement('div');
      el.className = 'toast align-items-center bg-' + type + ' ' + textCls + ' border-0 shadow-sm mb-2';
      el.setAttribute('role', 'alert');
      el.setAttribute('aria-live', 'assertive');
      el.setAttribute('aria-atomic', 'true');
      el.style.minWidth = '280px';
      el.innerHTML =
        '<div class="d-flex">'
        + '<div class="toast-body fw-semibold"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>'
        + '<button type="button" class="' + closeCls + ' me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>'
        + '</div>';
      container.appendChild(el);
      var opts = duration > 0 ? { delay: duration, autohide: true } : { autohide: false };
      bootstrap.Toast.getOrCreateInstance(el, opts).show();
      el.addEventListener('hidden.bs.toast', function () { el.remove(); });
    }

    document.addEventListener('DOMContentLoaded', function () {
      var pending = document.getElementById('login-pending-toasts');
      if (!pending) return;
      pending.querySelectorAll('span[data-msg]').forEach(function (s) {
        showToast(s.dataset.msg, s.dataset.type);
      });
    });
  }());
  </script>
</body>
</html>
