<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - DelcoLtda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
    }
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    .card-body {
      padding: 40px;
    }
    .form-control {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 15px;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-primary {
      background-color: #667eea;
      border: none;
      padding: 10px;
      font-weight: 600;
      border-radius: 8px;
      margin-top: 20px;
    }
    .btn-primary:hover {
      background-color: #764ba2;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #667eea;
      font-weight: bold;
      font-size: 28px;
    }
    .alert {
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="card-body">
        <div class="logo">
          <h1>🔐 DelcoLtda</h1>
          <p class="text-muted">Sistema de Operaciones</p>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">RUT</label>
            <input type="text" name="username" class="form-control" placeholder="Ej: 111111115" required autofocus>
            <small class="text-muted">Ingresa solo los dígitos sin puntos ni guión</small>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">Iniciar Sesión</button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small">
          <strong>Usuarios de prueba:</strong><br>
          RUT: 111111112 | 111111113 | 111111114 | 111111115 | 111111116<br>
          <strong>Contraseña:</strong> 123456789
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
