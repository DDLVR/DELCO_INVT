{% extends 'base.html' %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px;">
  <div class="row mb-4">
    <div class="col-12">
      <h1>✏️ Editar Cliente</h1>
      <p class="text-muted">Cliente: <strong>{{ cliente.numero_cliente }}</strong></p>
    </div>
  </div>

  <div class="card shadow-sm delco-panel-card">
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %}

        <!-- ═════════════════════════════════════════════════════ -->
        <!-- DATOS PRINCIPALES (VERDES) -->
        <!-- ═════════════════════════════════════════════════════ -->
        <div class="card delco-form-section mb-4">
          <div class="card-header card-header-delco">
            <h5 class="mb-0">📋 Campos Editables desde Gestión de Clientes</h5>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Sector</label>
                <input type="text" name="sector" class="form-control" value="{{ cliente.sector|default:'' }}">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Tipo de Suministro</label>
                <input type="text" name="tipo_suministro" class="form-control" value="{{ cliente.tipo_suministro|default:'' }}">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Numero de Cliente</label>
                <input type="text" name="numero_cliente" class="form-control" value="{{ cliente.numero_cliente }}">
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Comuna</label>
                <input type="text" name="comuna" class="form-control" value="{{ cliente.comuna|default:'' }}">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Nombre Cliente</label>
                <input type="text" name="customer_name" class="form-control" value="{{ cliente.customer_name|default:'' }}">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Dirección Instalación</label>
                <input type="text" name="installation_address" class="form-control" value="{{ cliente.installation_address|default:'' }}">
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Marca Medidor</label>
                <input type="text" name="meter_manufacturer_id" class="form-control" value="{{ cliente.meter_manufacturer_id|default:'' }}">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Proyecto</label>
                <select name="proyecto" class="form-select">
                  <option value="" {% if not cliente.proyecto %}selected{% endif %}>Sin proyecto</option>
                  {% for proyecto in proyectos_disponibles %}
                  <option value="{{ proyecto }}" {% if cliente.proyecto == proyecto %}selected{% endif %}>{{ proyecto }}</option>
                  {% endfor %}
                  {% if cliente.proyecto and cliente.proyecto not in proyectos_disponibles %}
                  <option value="{{ cliente.proyecto }}" selected>{{ cliente.proyecto }}</option>
                  {% endif %}
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Serie Medidor</label>
                <input type="text" name="meter_serial_n_1" class="form-control" value="{{ cliente.meter_serial_n_1|default:'' }}">
              </div>
            </div>
          </div>
        </div>

        <!-- ═════════════════════════════════════════════════════ -->
        <!-- BOTONES -->
        <!-- ═════════════════════════════════════════════════════ -->
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">✓ Guardar Cambios</button>
          <a href="{% url 'clientes_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
