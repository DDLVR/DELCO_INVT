{% extends 'base.html' %}

{% block title %}Nuevo ticket{% endblock %}

{% block content %}
<div class="container" style="max-width: 760px;">
  <div class="mb-4">
    <a href="{% url 'soporte_hub' %}" class="btn btn-sm btn-outline-secondary mb-2">← Volver al hub</a>
    <h1 class="h3 mb-1">Levantar ticket de soporte</h1>
    <p class="text-muted">Describe el bug o problema con el máximo detalle posible.</p>
  </div>

  <div class="card shadow-sm delco-panel-card">
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
          <input type="text" name="titulo" class="form-control" required maxlength="200" placeholder="Ej: Error al validar OT desde MoreApp">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Categoría</label>
            <select name="categoria" class="form-select" id="categoriaTicket">
              {% for codigo, nombre in categorias %}
              <option value="{{ codigo }}" {% if request.GET.categoria == codigo %}selected{% endif %}>{{ nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Prioridad</label>
            <select name="prioridad" class="form-select">
              {% for codigo, nombre in prioridades %}
              <option value="{{ codigo }}" {% if codigo == 'MEDIA' %}selected{% endif %}>{{ nombre }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Pantalla / URL (opcional)</label>
          <input type="text" name="pagina_url" class="form-control" placeholder="Ej: /ordenes/123/ o Inventario → Medidores">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Descripción <span class="text-danger">*</span></label>
          <textarea name="descripcion" class="form-control" rows="7" required placeholder="Qué pasó, pasos para reproducir, resultado esperado vs actual..."></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-send"></i> Enviar ticket
          </button>
          <a href="{% url 'soporte_hub' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
